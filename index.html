<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keuangan - Arqom</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap">
<style>
:root{--bg:#fbf7e6;--card:#fffdf4;--ink:#1c2b22;--mut:#6b7a6f;--line:#ece6cf;--pri:#2d7a52;--onpri:#fff;--pri2:#e9f2e4;--side:#14291f;--bad:#b3402f;--badbg:#fbe7e1;--ok:#2d7a52;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1812;--card:#17241c;--ink:#e8efe7;--mut:#93a597;--line:#26362b;--pri:#4fb583;--onpri:#08150e;--pri2:#1f3a2c;--bad:#ff9b8a;--badbg:#3a1f1a;--ok:#4fb583}}
:root[data-theme="dark"]{--bg:#0f1812;--card:#17241c;--ink:#e8efe7;--mut:#93a597;--line:#26362b;--pri:#4fb583;--onpri:#08150e;--pri2:#1f3a2c;--bad:#ff9b8a;--badbg:#3a1f1a;--ok:#4fb583}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:14.5px;line-height:1.45}
h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
/* sidebar utama */
.side{background:var(--side);color:#dfe9e1;padding:20px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;align-self:start}
.brand{display:flex;align-items:center;gap:10px;padding:0 4px 24px}
.brand img{width:42px;height:42px;flex:none}
.brand b{display:block;font-family:'Fraunces',serif;font-size:21px;font-weight:600;color:#fff;line-height:1.1}
.brand small{color:#8fa597;font-size:12px}
.menu{display:flex;flex-direction:column;gap:4px}
.menu a,.logout{display:flex;align-items:center;gap:12px;color:#c9d8cd;text-decoration:none;padding:11px 12px;border-radius:10px;font-weight:500}
.menu a:hover,.logout:hover{background:rgba(255,255,255,.07)}
.menu a[aria-current=page]{background:#2d7a52;color:#fff}
.side svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.logout{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);border-radius:0;padding-top:18px;background:none;border-left:0;border-right:0;border-bottom:0;color:#8fa597;width:100%;text-align:left}
/* konten */
.content{padding:22px 24px 48px;min-width:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.burger{display:none;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600}
h1{font-size:26px;margin:0;font-weight:600;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:230px minmax(0,1fr) 280px;gap:20px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px}
/* menu jenis pembayaran */
.types{padding:8px;position:sticky;top:16px}
.types button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:0;background:none;color:var(--ink);padding:10px 12px;border-radius:12px;font-weight:500}
.types button:hover{background:var(--pri2)}
.types button[aria-current=page]{background:var(--pri2);font-weight:700}
.types .d{width:9px;height:9px;border-radius:50%;flex:none}
.types .n{flex:1;line-height:1.25}
.types .c{color:var(--mut);font-size:13px}
/* kartu angka */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{padding:16px}
.ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:18px;margin-bottom:14px}
.t1{background:rgba(204,150,50,.2);color:#b9812a}.t2{background:rgba(45,122,82,.17);color:var(--ok)}.t3{background:rgba(179,64,47,.15);color:var(--bad)}.t4{background:rgba(70,100,170,.17);color:#5a78c0}
.stat b{display:block;font-family:'Fraunces',serif;font-size:21px;font-weight:600}
.stat span{color:var(--mut);font-size:13px}
/* tabel */
.tbl{overflow:hidden}
.th{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:18px 20px}
.th h2{margin:0;font-size:20px;font-weight:600}
.th p{margin:0;color:var(--mut);font-size:13px}
.tools{display:flex;gap:10px;flex-wrap:wrap;flex:1;justify-content:flex-end}
.tools input{flex:1;max-width:240px;min-width:140px;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.btn{background:var(--pri);color:var(--onpri);border:0;border-radius:12px;padding:10px 16px;font-weight:600}
.scroll{overflow-x:auto;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--mut);padding:12px 20px;text-transform:none}
td{padding:14px 20px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--pri2)}
.pill{display:inline-block;border:1px solid;border-radius:20px;padding:2px 12px;font-size:12.5px;font-weight:600}
.pill.l{color:var(--ok);border-color:var(--ok)}
.pill.b{color:var(--bad);border-color:var(--bad);background:var(--badbg)}
.act{display:flex;gap:8px;justify-content:flex-end}
.sm{font-size:13px;border-radius:9px;padding:6px 12px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.sm.del{color:var(--bad);border-color:var(--bad)}
.empty{text-align:center;color:var(--mut);padding:32px}
/* panel kanan */
.right h3{font-size:16px;margin:0 0 10px;font-weight:600}
.right section{margin-bottom:20px}
.it{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:8px}
.av{width:34px;height:34px;border-radius:50%;background:var(--pri2);color:var(--ok);display:grid;place-items:center;font-family:'Fraunces',serif;font-weight:600;font-size:13px;flex:none}
.it .w{flex:1;min-width:0}
.it .w b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .w small{color:var(--mut)}
.ck{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--ok);flex:none}
.tag{background:var(--pri);color:var(--onpri);border:0;border-radius:8px;padding:5px 11px;font-size:12.5px;font-weight:600}
/* dialog + toast */
dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);padding:22px;width:min(400px,92vw)}
dialog::backdrop{background:rgba(10,20,15,.5)}
dialog h3{margin:0 0 14px;font-size:20px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
dialog input,dialog select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.dl{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--side);color:#fff;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.on{opacity:1}
.ov{display:none}
@media (max-width:1180px){
  .grid,.grid.nr{grid-template-columns:1fr}
  .types .gl{display:none}
  .types{position:static;display:flex;overflow-x:auto;gap:4px}
  .types button{width:auto;white-space:nowrap}
  .types .n{flex:none}
}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:30;transform:translateX(-100%);transition:transform .25s;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  body.open .side{transform:none}
  body.open .ov{display:block;position:fixed;inset:0;background:rgba(10,20,15,.5);z-index:20}
  .burger{display:inline-block}
  .content{padding:16px 14px 40px}
  h1{font-size:22px}
}
@media (prefers-reduced-motion:reduce){.side,#toast{transition:none}}
[hidden]{display:none!important}
@media (min-width:1181px){.grid.nr{grid-template-columns:230px minmax(0,1fr)}.grid.np{grid-template-columns:minmax(0,1fr)}}
.types .gl{padding:12px 12px 4px;font-size:12px;font-weight:600;color:var(--mut)}
.types .gl:first-child{padding-top:6px}
.tools select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;max-width:190px}
.grp td{background:var(--pri2);font-weight:700;color:var(--ok);padding:9px 20px;font-size:13px}
.mono{font-variant-numeric:tabular-nums;color:var(--mut)}
.sm.pri{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.gc{padding:18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.av.lg{width:52px;height:52px;font-size:18px}
.gn b{display:block;font-family:'Fraunces',serif;font-size:17px;font-weight:600}
.gn span{color:var(--mut);font-size:13px}
.gc dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:13px;width:100%}
.gc dt{color:var(--mut)}.gc dd{margin:0;font-weight:500}
.top .note{margin-left:auto;color:var(--mut);font-size:12.5px}
@media (max-width:820px){.top .note{display:none}.top #reset{margin-left:auto}}
.wd{padding:18px}
.wd h3{margin:0 0 10px;font-size:16px;font-weight:600}
.li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.li:first-of-type{border-top:0}
.li span{color:var(--mut)}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0}
.bar span{width:34px;color:var(--mut);font-size:13px}
.bar b{width:22px;text-align:right}
.bt{flex:1;height:10px;border-radius:6px;background:var(--pri2);overflow:hidden}
.bt i{display:block;height:100%;background:var(--pri);border-radius:6px;min-width:4px}
.gcards.wide{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.set input,.set select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.hint{color:var(--mut);font-size:12.5px;margin:10px 0 0}
.ferr{color:var(--bad);font-size:13px;margin:10px 0 0}
.ferr:empty{display:none}
.gcards .wd{display:block}
.ic:empty{display:none}
.stats.s3{grid-template-columns:repeat(3,1fr)}
.stats.s3 .stat{display:flex;flex-direction:column-reverse;gap:2px}
.stats.s3 b{font-size:22px}
@media (max-width:520px){.stats.s3{gap:8px}.stats.s3 .stat{padding:12px}.stats.s3 b{font-size:14.5px}.stats.s3 span{font-size:12px}}
.tabs2{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 16px;overflow-x:auto}
.tabs2 button{font:inherit;font-weight:600;background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:10px 14px;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.tabs2 button[aria-selected=true]{color:var(--pri);border-bottom-color:var(--pri)}
.st{font-weight:600;font-size:13px;white-space:nowrap}
.st::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:6px}
.st.ok{color:var(--ok)}.st.no{color:var(--bad)}
.sm.ghost,.sm.del{border-color:transparent;background:transparent;color:var(--mut)}
.sm.del:hover{color:var(--bad)}
td{padding-top:15px;padding-bottom:15px}
</style>
</head>

    const tung=i=>DATA.filter(d=>d.sid===i&&!d.lunas).reduce((a,d)=>a+d.nom,0);
    const list=SISWA.map((s,i)=>({s,i})).filter(({s})=>(!kf||s.kelas===kf)&&(s.nama.toLowerCase().includes(q)||s.nisn.includes(q)))
      .sort((a,b)=>KELAS.indexOf(a.s.kelas)-KELAS.indexOf(b.s.kelas)||a.s.nama.localeCompare(b.s.nama));
    let rows='',last='';
    list.forEach(({s,i})=>{if(s.kelas!==last){last=s.kelas;rows+=`<tr class="grp"><td colspan="6">Kelas ${s.kelas} · ${jj(s.kelas)}</td></tr>`}
      const t=tung(i);rows+=tr(esc(s.nama),`<span class="mono">${esc(s.nisn)}</span>`,s.kelas,jj(s.kelas),t?`<span class="pill b">${rp(t)}</span>`:pill(1,'Lunas',''),act(btn('edm',i,'Edit')+btn('delm',i,'Hapus','del')))});
    return {t:'Data Murid',sub:SISWA.length+' murid terdaftar',ph:'Cari nama / NISN...',fall:'Semua kelas',fopts:KELAS,head:['Nama Murid','NISN','Kelas','Jenjang','Tunggakan',''],rows,
      stats:[['t4','#','Total Murid',SISWA.length],['t2','M','Murid MTs',SISWA.filter(s=>jj(s.kelas)==='MTs').length],['t1','A','Murid MA',SISWA.filter(s=>jj(s.kelas)==='MA').length],['t3','!','Punya Tunggakan',SISWA.filter((s,i)=>tung(i)).length]],
      add:['+ Tambah Murid',()=>muridForm()]};
  },
  jadwal(q){
    const s=JADWAL.filter(j=>(!kf||j.kelas===kf)&&(j.mapel+gname(j.gid)).toLowerCase().includes(q))
      .sort((a,b)=>HARI.indexOf(a.hari)-HARI.indexOf(b.hari)||a.jam.localeCompare(b.jam)||a.kelas.localeCompare(b.kelas,'id',{numeric:true}));
    let rows='',last='';
    s.forEach(j=>{if(j.hari!==last){last=j.hari;rows+=`<tr class="grp"><td colspan="5">${j.hari}</td></tr>`}
      rows+=tr(j.jam,j.kelas,esc(j.mapel),esc(gname(j.gid)),act(btn('edj',j.id,'Edit')+btn('delj',j.id,'Hapus','del')))});
    return {t:'Jadwal Pelajaran',sub:JADWAL.length+' jam pelajaran per pekan',ph:'Cari mapel / guru...',fall:'Semua kelas',fopts:KELAS,head:['Jam','Kelas','Mata Pelajaran','Guru',''],rows,
      stats:[['t4','#','Total Jam Pelajaran',JADWAL.length],['t2','H','Jadwal Hari Ini',JADWAL.filter(j=>j.hari===HARI_INI).length],['t1','G','Guru Terjadwal',new Set(JADWAL.map(j=>j.gid)).size],['t3','K','Kelas Terjadwal',new Set(JADWAL.map(j=>j.kelas)).size]],
      add:['+ Tambah Jadwal',()=>jadwalForm()]};
  },
  pengaturan(){
    const f=(id,l,v,t='text')=>`<label for="${id}">${l}</label><input id="${id}" type="${t}" value="${esc(v)}">`;
    return {t:'Pengaturan',sub:'',stats:[],wide:1,
      cards:`<div class="card wd set"><h3>Profil Lembaga</h3>${f('s_nama','Nama singkat (sidebar)',SET.nama)}${f('s_sub','Keterangan',SET.sub)}${f('s_tahun','Tahun ajaran',SET.tahun)}${f('s_alamat','Alamat',SET.alamat)}
        <label for="s_tema">Tampilan</label><select id="s_tema">${[['auto','Otomatis (ikut perangkat)'],['light','Terang'],['dark','Gelap']].map(o=>`<option value="${o[0]}" ${SET.tema===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>
        <div class="card wd set"><h3>Nominal Default Pembayaran</h3>${TYPES.map(t=>f('n_'+t.id,t.nama,t.nom,'number')).join('')}<p class="hint">Dipakai sebagai nominal awal saat menambah pembayaran baru.</p></div>
        <div class="card wd set"><h3>Simpan</h3><button class="btn" data-a="saveset">Simpan Pengaturan</button></div>`};
  }
};
const PN={dashboard:'Dashboard',keuangan:'Keuangan',guru:'Data Guru',murid:'Data Murid',jadwal:'Jadwal',pengaturan:'Pengaturan'};

/* ---------- Keuangan versi sederhana: 4 tab ---------- */
let kt='murid';
const TABS=[['murid','Pembayaran Murid'],['bos','Dana BOS'],['keluar','Pengeluaran'],['gaji','Gaji Guru']];
const st=(ok,a,b)=>`<span class="st ${ok?'ok':'no'}">${ok?a:b}</span>`;
function muridKeu(q){
  const t0=TYPES.find(t=>t.nama===kf), sc=DATA.filter(d=>!t0||d.jenis===t0.id), L=sc.filter(d=>d.lunas);
  const list=sc.map(d=>({d,s:SISWA[d.sid]})).filter(x=>(x.s.nama+' '+x.s.nisn+' '+x.s.kelas).toLowerCase().includes(q))
    .sort((a,b)=>a.d.lunas-b.d.lunas||KELAS.indexOf(a.s.kelas)-KELAS.indexOf(b.s.kelas)||a.s.nama.localeCompare(b.s.nama));
  const belum=sc.filter(d=>!d.lunas).reduce((a,d)=>a+d.nom,0);
  return {t:'Pembayaran Murid',sub:`${L.length} dari ${sc.length} lunas · belum dibayar ${rp(belum)}`,ph:'Cari nama, NISN, atau kelas',fall:'Semua pembayaran',fopts:TYPES.map(t=>t.nama),
    head:['Murid','Kelas','Pembayaran','Nominal','Status',''],
    rows:list.map(({d,s})=>tr(`<b>${esc(s.nama)}</b><br><small class="mono">${s.nisn}</small>`,s.kelas,tp(d.jenis).nama,rp(d.nom),st(d.lunas,'Lunas','Belum bayar'),
      act((d.lunas?'':btn('lunas',d.id,'Tandai lunas','pri'))+btn('delp',d.id,'Hapus','del ghost')))).join(''),
    add:['+ Tambah Pembayaran',()=>{
      const t0=TYPES.find(t=>t.nama===kf)||tp('spp');
      openForm('Tambah Pembayaran',[
        {k:'sid',l:'Murid',t:'select',o:SISWA.map((s,i)=>[i,`${s.kelas} · ${s.nama} · ${s.nisn}`]).sort((a,b)=>a[1].localeCompare(b[1],'id',{numeric:true}))},
        {k:'jenis',l:'Jenis pembayaran',t:'select',o:TYPES.map(t=>[t.id,t.nama]),v:t0.id,ch:v=>$('f_nom').value=tp(v).nom},
        {k:'nom',l:'Nominal (Rp)',t:'number',v:t0.nom}
      ],v=>{DATA.push({id:uid++,sid:+v.sid,jenis:v.jenis,nom:+v.nom,lunas:false});toast('Pembayaran ditambahkan');render()});
    }]};
}
function keluarKeu(q){
  const tipe=kf==='Formal'?'formal':kf==='Operasional'?'op':'';
  const sc=EXP.filter(e=>!tipe||e.tipe===tipe).filter(e=>(e.kat+' '+e.ket).toLowerCase().includes(q)).sort((a,b)=>b.tgl.localeCompare(a.tgl));
  return {t:'Pengeluaran',sub:`${sc.length} transaksi · total ${rp(sum(sc))}`,ph:'Cari pengeluaran',fall:'Semua pengeluaran',fopts:['Operasional','Formal'],
    head:['Tanggal','Kategori','Jumlah',''],
    rows:sc.map(e=>tr(tgl(e.tgl),`<b>${esc(e.kat)}</b><br><small class="mono">${esc(e.ket)} · ${e.tipe==='formal'?'Formal':'Operasional'}</small>`,rp(e.jumlah),act(btn('dele',e.id,'Hapus','del ghost')))).join(''),
    add:['+ Tambah Pengeluaran',()=>openForm('Tambah Pengeluaran',[
      {k:'tipe',l:'Jenis',t:'select',o:[['op','Operasional'],['formal','Formal']],v:tipe||'op',ch:v=>{$('f_kat').innerHTML=(v==='formal'?CAT_FM:CAT_OP).map(c=>`<option>${esc(c)}</option>`).join('')}},
      {k:'kat',l:'Kategori',t:'select',o:(tipe==='formal'?CAT_FM:CAT_OP).map(c=>[c,c])},
      {k:'tgl',l:'Tanggal',t:'date',v:'2026-10-20'},{k:'ket',l:'Keterangan',t:'text',r:0},{k:'jumlah',l:'Jumlah (Rp)',t:'number'}
    ],v=>{EXP.push({id:uid++,tipe:v.tipe,kat:v.kat,ket:v.ket||'-',jumlah:+v.jumlah,tgl:v.tgl});toast('Pengeluaran dicatat');render()})]};
}
function gajiKeu(q){
  const s=GURU.filter(g=>g.nama.toLowerCase().includes(q)), n=GURU.filter(g=>g.paid).length;
  return {t:'Gaji Guru',sub:`Periode Oktober 2026 · ${n} dari ${GURU.length} sudah dibayar`,ph:'Cari nama guru',head:['Nama','Gaji diterima','Status',''],
    rows:s.map(g=>tr(`<b>${esc(g.nama)}</b><br><small class="mono">${esc(g.jabatan)}</small>`,`<b>${rp(net(g))}</b><br><small class="mono">Pokok ${rp(g.pokok)} + tunjangan ${rp(g.tunj)} − potongan ${rp(g.potong)}</small>`,
      st(g.paid,'Sudah dibayar','Belum dibayar'),act(g.paid?'':btn('pot',g.id,'Potongan','ghost')+btn('bayar',g.id,'Bayar','pri')))).join('')};
}
function keuView(q){
  const masuk=DATA.filter(d=>d.lunas).reduce((a,d)=>a+d.nom,0)+sum(BOS), keluar=sum(EXP);
  const v=kt==='murid'?muridKeu(q):kt==='bos'?bosView(q):kt==='keluar'?keluarKeu(q):gajiKeu(q);
  v.stats=[['','','Pemasukan',rp(masuk)],['','','Pengeluaran',rp(keluar)],['','','Saldo',rp(masuk-keluar)]];
  return v;
}

/* ---------- render ---------- */
function render(){
  save();
  $('types').innerHTML=GROUPS.map(g=>`<div class="gl">${g[0]}</div>`+g[1].map(([id,n,c])=>`<button data-id="${id}" ${id===cur?'aria-current="page"':''}><span class="d" style="background:${c}"></span><span class="n">${n}</span><span class="c">${cnt(id)}</span></button>`).join('')).join('');
  document.querySelectorAll('#types button').forEach(b=>b.onclick=()=>{cur=b.dataset.id;kf='';$('q').value='';document.body.classList.remove('open');render()});
  const q=$('q').value.toLowerCase();
  const v=page!=='keuangan'?PV[page](q):keuView(q);
  $('right').innerHTML=v.pay?rightPanel():'';
  document.querySelector('.grid').classList.toggle('nr',!v.pay);document.querySelector('.grid').classList.add('np');
  $('types').hidden=true;$('ptitle').textContent=PN[page];$('gc').classList.toggle('wide',!!v.wide);renderMenu();
  $('tabs2').hidden=page!=='keuangan';if(page==='keuangan')$('tabs2').innerHTML=TABS.map(([id,n])=>`<button role="tab" data-tab="${id}" aria-selected="${id===kt}">${n}</button>`).join('');
  $('stats').classList.toggle('s3',v.stats.length===3);
  const fk=$('fk'); fk.hidden=!v.fopts;
  if(v.fopts){fk.innerHTML=`<option value="">${v.fall}</option>`+v.fopts.map(o=>`<option>${esc(o)}</option>`).join('');fk.value=kf}
  $('judul').textContent=v.t; $('sub').textContent=v.sub; $('q').placeholder=v.ph;
  $('stats').innerHTML=v.stats.map(x=>`<div class="card stat"><div class="ic ${x[0]}">${x[1]}</div><b>${x[3]}</b><span>${x[2]}</span></div>`).join('');
  $('add').hidden=!v.add; if(v.add){$('add').textContent=v.add[0];$('add').onclick=v.add[1]}
  $('tblc').hidden=!!v.cards; $('gc').hidden=!v.cards;
  if(v.cards)$('gc').innerHTML=v.cards;
  else{$('thead').innerHTML='<tr>'+v.head.map(h=>`<th>${h}</th>`).join('')+'</tr>';
    $('rows').innerHTML=v.rows||`<tr><td colspan="${v.head.length}" class="empty">Belum ada data yang cocok. Coba ubah filter atau tambah data baru.</td></tr>`}
}

/* ---------- aksi ---------- */
const rm=(a,i)=>a.splice(a.findIndex(x=>x.id===i),1);
function sure(b,fn){
  if(b.dataset.s){fn();toast('Data dihapus');render();return}
  const o=b.textContent;b.dataset.s=1;b.textContent='Yakin?';setTimeout(()=>{b.dataset.s='';b.textContent=o},2500);
}
const ACT={
  lunas:i=>{DATA.find(d=>d.id===i).lunas=true;toast('Ditandai lunas');render()},
  delp:(i,b)=>sure(b,()=>rm(DATA,i)), delb:(i,b)=>sure(b,()=>rm(BOS,i)), dele:(i,b)=>sure(b,()=>rm(EXP,i)), delg:(i,b)=>sure(b,()=>{rm(GURU,i);for(let k=JADWAL.length-1;k>=0;k--)if(JADWAL[k].gid===i)JADWAL.splice(k,1)}),
  edg:i=>guruForm(GURU.find(g=>g.id===i)), edm:i=>muridForm(i), edj:i=>jadwalForm(JADWAL.find(j=>j.id===i)),
  delj:(i,b)=>sure(b,()=>rm(JADWAL,i)),
  delm:(i,b)=>sure(b,()=>{SISWA.splice(i,1);for(let k=DATA.length-1;k>=0;k--){if(DATA[k].sid===i)DATA.splice(k,1);else if(DATA[k].sid>i)DATA[k].sid--}}),
  saveset:()=>{SET.nama=$('s_nama').value.trim()||SET.nama;SET.sub=$('s_sub').value;SET.tahun=$('s_tahun').value;SET.alamat=$('s_alamat').value;SET.tema=$('s_tema').value;
    TYPES.forEach(t=>{const n=+$('n_'+t.id).value;if(n>=0)t.nom=n});applySet();toast('Pengaturan disimpan');render()},
  tagih:(i,b)=>toast('Pengingat tagihan dikirim ke wali '+b.dataset.n),
  pot:i=>{const g=GURU.find(x=>x.id===i);openForm('Potongan '+g.nama,[{k:'p',l:'Potongan (Rp)',t:'number',v:g.potong,r:0}],v=>{g.potong=+v.p||0;render()})},
  bayar:i=>{const g=GURU.find(x=>x.id===i);if(g.paid)return;g.paid=true;
    EXP.push({id:uid++,tipe:'formal',kat:CAT_FM[0],ket:'Gaji '+g.nama+' Okt 2026',jumlah:net(g),tgl:'2026-10-20'});
    toast('Gaji dibayar dan dicatat ke Pengeluaran Formal');render()}
};
document.addEventListener('click',e=>{const tb=e.target.closest('[data-tab]');if(tb){kt=tb.dataset.tab;kf='';$('q').value='';render();return}
  const m=e.target.closest('[data-p]');if(m){e.preventDefault();page=m.dataset.p;kf='';$('q').value='';document.body.classList.remove('open');render();return}
  const b=e.target.closest('[data-a]');if(b&&ACT[b.dataset.a])ACT[b.dataset.a](+b.dataset.i,b)});
$('q').oninput=render;
$('fk').onchange=e=>{kf=e.target.value;render()};
$('cancel').onclick=()=>$('dlg').close();
$('frm').onsubmit=e=>{if(FORM&&FORM()===false)e.preventDefault()};
$('burger').onclick=()=>document.body.classList.add('open');
$('ov').onclick=()=>document.body.classList.remove('open');
$('reset').onclick=e=>{const b=e.currentTarget;
  if(b.dataset.s){RESET=1;try{localStorage.removeItem(STORE)}catch(x){}location.reload();return}
  b.dataset.s=1;b.textContent='Yakin reset?';setTimeout(()=>{b.dataset.s='';b.textContent='Reset data contoh'},2500)};
load();applySet();
render();
</script>
</body>
</html>
